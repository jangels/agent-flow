[project]
name = "agent-flow-langgraph-bridge"
version = "0.1.0"
description = "LangGraph bridge service for agent-flow (path A integration prototype)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.4",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "uvicorn[standard]>=0.53.0",
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
