name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 09:00 UTC 全量复扫（依赖库新披露的 CVE / 泄露历史）
    - cron: "0 9 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 全历史扫描：泄露一旦进过历史就要抓出来
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          /tmp/gitleaks version
      - name: Scan full history
        run: /tmp/gitleaks detect --source . --redact --verbose

  dependencies:
    name: Dependencies audit (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install osv-scanner (pinned)
        run: |
          curl -sSfL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64"
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --version
      # 自动识别 package-lock.json / uv.lock / Cargo.lock，一工具扫三生态
      - name: Scan lockfiles for known vulnerabilities
        run: /tmp/osv-scanner scan source --recursive ./

  rust-advisories:
    name: Rust advisories (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Cargo.lock
        working-directory: src-tauri
        run: cargo audit
